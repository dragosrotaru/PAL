[package]
name = "pal-lsp"
version = "0.1.0"
edition = "2021"

[dependencies]
chumsky = "0.9.3"
dashmap = "6"
env_logger = "0.11"
im-rc = "15"
log = "0.4"
ropey = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-lsp = { version = "0.20.0", features = ["proposed"] }
